    <h1>我的家乡是德宏芒市</h1>

    <h2>泡鲁达</h2>
    <p>泡鲁达是芒市最受欢迎的甜品，椰奶中加入西米、紫米、面包干和碎冰，香甜清爽，是消暑的绝佳选择。</p>

    <h2>景颇手抓饭</h2>
    <p>景颇族的传统美食，芭蕉叶上铺满米饭，配上烤肉、舂菜等各色菜肴，用手抓着吃，原汁原味，别有风情。</p>

    <h2>纸包鱼</h2>
    <p>鲜鱼用纸包住秘制调料烤制而成，鱼肉鲜嫩，麻辣鲜香，汤汁完全锁在纸包里，揭开瞬间香气四溢。</p>

    <h2>缅甸甩粑粑</h2>
    <p>受缅甸风味影响的特色小吃，面饼甩得薄如蝉翼，煎至金黄酥脆，可以加香蕉、炼乳，外酥内软，甜香可口。</p>
